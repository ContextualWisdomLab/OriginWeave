name: Diagnose TLS integration errors

on:
  push:
    branches:
      - feat/tls-server-identity
    paths:
      - .github/workflows/diagnose-tls-errors.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/tls-server-identity

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1

      - name: Add assertion diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/originweave-tls/tests/handshake_integration.rs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'assert!(matches!(error, TlsError::UnknownIssuer { .. }));': 'assert!(matches!(error, TlsError::UnknownIssuer { .. }), "unexpected untrusted-root error: {error:?}");',
              'assert!(matches!(error, TlsError::AlpnRequired));': 'assert!(matches!(error, TlsError::AlpnRequired), "unexpected ALPN error: {error:?}");',
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(f"expected one assertion marker: {before}")
              text = text.replace(before, after, 1)
          path.write_text(text, encoding="utf-8")
          PY
          cargo generate-lockfile

      - name: Run focused integration diagnostics
        run: cargo test --locked -p originweave-tls --test handshake_integration -- --nocapture
