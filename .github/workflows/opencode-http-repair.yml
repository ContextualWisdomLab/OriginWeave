name: OpenCode HTTP repair

on:
  pull_request:
    paths:
      - .github/workflows/opencode-http-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opencode-http-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: Repair bounded HTTP implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      OPENAI_BASE_URL: https://integrate.api.nvidia.com/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Require NVIDIA NIM development credential
        run: test -n "$NVIDIA_NIM_API_KEY"
      - name: Install pinned OpenCode CLI
        run: npm install --global opencode-ai@1.0.152
      - name: Select an available NVIDIA reasoning model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${NVIDIA_NIM_API_KEY}" \
            "${OPENAI_BASE_URL}/models" > /tmp/nim-models.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/nim-models.json').read_text(encoding='utf-8'))
          identifiers = sorted(
              item['id'] for item in payload.get('data', [])
              if isinstance(item, dict) and isinstance(item.get('id'), str)
          )
          preferences = (
              'nemotron',
              'deepseek',
              'qwen',
              'llama',
          )
          selected = next(
              (identifier for preference in preferences for identifier in identifiers
               if preference in identifier.lower()),
              identifiers[0] if identifiers else None,
          )
          if selected is None:
              raise SystemExit('NVIDIA NIM returned no available models')
          print(f'NIM_MODEL_ID={selected}')
          PY
      - name: Configure OpenCode for NVIDIA OpenAI-compatible API
        run: |
          cat > opencode.json <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "nvidia": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "NVIDIA NIM",
                "options": {
                  "baseURL": "https://integrate.api.nvidia.com/v1",
                  "apiKey": "{env:NVIDIA_NIM_API_KEY}"
                },
                "models": {
                  "selected": {
                    "name": "Selected NVIDIA NIM model"
                  }
                }
              }
            },
            "model": "nvidia/selected"
          }
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os

          path = Path('opencode.json')
          config = json.loads(path.read_text(encoding='utf-8'))
          selected = os.environ['NIM_MODEL_ID']
          model = config['provider']['nvidia']['models'].pop('selected')
          config['provider']['nvidia']['models'][selected] = model
          config['model'] = f'nvidia/{selected}'
          path.write_text(json.dumps(config, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Run bounded OpenCode repair
        shell: bash
        run: |
          cat > /tmp/http-repair-prompt.md <<'EOF'
          Work directly on the current `feat/http11-semantics` branch for OriginWeave PR #11.

          Read `AGENTS.md`, `CLAUDE.md`, the approved HTTP design, implementation plan, ADR 0007, all current HTTP source/tests, current review threads if available, and `docs/validation/http-current-diagnostics.txt` if present.

          Complete the independently reusable `originweave-http` Rust slice. Fix all compile, format, Clippy, rustdoc, parser, deadline, framing, content-decoding, digest, MIME, disposition, redirect, evidence, and test defects. Preserve the exact-stream authority chain and the explicit prohibition on DNS, connecting, reconnecting, proxy/PAC, pooling, redirect follow, cookies, file writes, browser calls, and model calls in production.

          Required technical outcomes:
          - safe Rust 1.97.1 and locked dependencies;
          - linear bounded body processing, exact-limit EOF handling, checked arithmetic;
          - strict RFC 9110/9112 framing and CRLF grammar;
          - RFC 9530 SHA-256/SHA-512 validation;
          - conservative bounded MIME and filename metadata;
          - complete deterministic public errors and credential-free evidence;
          - realistic real-loopback rustls tests proving exactly one connection and no redirect follow;
          - complete error/evidence/property-style boundary tests;
          - Python governance, fmt, locked check/test, Clippy -D warnings, rustdoc -D warnings;
          - exact 100% production function, line, region, and branch coverage;
          - binding README/ARCHITECTURE/AGENTS/CLAUDE/CHANGELOG/roadmap/quality-gate/APA-7 doctoring updates;
          - remove all temporary diagnostic/export/one-shot workflows and generated diagnostic source before completion.

          Do not approve, merge, publish, release, weaken checks, alter branch protection, use `COPILOT_GITHUB_TOKEN`, or create another PR. Keep PR #11 draft until independent review and required checks are green. Iterate locally until the focused test and documentation commands pass. Make only reviewable source changes.
          EOF
          opencode run --model "nvidia/${NIM_MODEL_ID}" "$(cat /tmp/http-repair-prompt.md)"
      - name: Verify focused repaired state
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo fmt --all --check
          cargo check --locked -p originweave-http --all-targets
          cargo test --locked -p originweave-http --all-targets
          cargo clippy --locked -p originweave-http --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked -p originweave-http --no-deps
      - name: Remove development-only files
        run: |
          rm -f opencode.json
          rm -f .github/workflows/opencode-http-repair.yml
          rm -f .github/workflows/export-http-workspace.yml
          rm -f .github/workflows/http-cargo-fix.yml
          rm -f .github/workflows/http-compile-diagnostics.yml
          rm -f .github/workflows/linearize-http-body-read.yml
          rm -f .github/workflows/extend-http-errors.yml
          rm -f .github/workflows/normalize-http-contracts.yml
          rm -f docs/validation/http-current-diagnostics.txt
      - name: Commit repaired branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "opencode-agent[bot]"
          git config user.email "opencode-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: complete bounded HTTP contracts"
          git push origin "HEAD:${TARGET_BRANCH}"
