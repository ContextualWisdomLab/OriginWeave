name: Harden IPv6 socket authority

on:
  push:
    branches:
      - feat/direct-socket-binding
    paths:
      - .github/workflows/harden-ipv6-socket-metadata.yml

permissions:
  contents: write

concurrency:
  group: harden-ipv6-socket-authority
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/direct-socket-binding
          fetch-depth: 0

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Reject unapproved IPv6 flow and scope metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/originweave-network/src/connection.rs")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '''        let connection_evidence = resolution
                  .authorize_connection(socket_address.ip())
          ''',
              '''        let has_unapproved_ipv6_metadata = match socket_address {
                  SocketAddr::V4(_) => false,
                  SocketAddr::V6(ipv6_socket) => {
                      ipv6_socket.flowinfo() != 0 || ipv6_socket.scope_id() != 0
                  }
              };
              let connection_evidence = resolution
                  .authorize_connection(socket_address.ip())
          ''',
          )
          replace_once(
              '''        if connection_evidence.canonical_address() != socket_address.ip() {
          ''',
              '''        if connection_evidence.canonical_address() != socket_address.ip()
                  || has_unapproved_ipv6_metadata
              {
          ''',
          )
          replace_once(
              '''    /// The requested IP was authorized only after canonicalization.
              NonCanonicalSocketAddress {
          ''',
              '''    /// The socket used a non-canonical IP or unapproved IPv6 transport metadata.
              NonCanonicalSocketAddress {
          ''',
          )
          replace_once(
              '''                "socket {socket_address} is not canonical; use IP address {canonical_address}",
          ''',
              '''                "socket {socket_address} is not canonical; use IP address {canonical_address} with zero IPv6 flow and scope metadata",
          ''',
          )
          replace_once(
              '''    use std::net::{IpAddr, Ipv4Addr, Ipv6Addr, TcpListener};
          ''',
              '''    use std::net::{IpAddr, Ipv4Addr, Ipv6Addr, SocketAddrV6, TcpListener};
          ''',
          )
          replace_once(
              '''    fn plan(maximum_attempts: u8) -> ConnectionPlan {
          ''',
              '''    fn ipv6_loopback_snapshot() -> ResolutionSnapshot {
                  ResolutionSnapshot::approve(
                      Origin::parse("http://[::1]").expect("IPv6 loopback origin"),
                      [IpAddr::V6(Ipv6Addr::LOCALHOST)],
                      &DestinationPolicy::from_allowed_classes([AddressClass::Loopback]),
                  )
                  .expect("managed IPv6 loopback snapshot")
              }

              fn plan(maximum_attempts: u8) -> ConnectionPlan {
          ''',
          )
          marker = '''        assert!(noncanonical.to_string().contains("canonical"));
              assert!(noncanonical.source().is_none());
              assert_eq!(noncanonical.attempt_count(), None);
          '''
          addition = marker + '''

              let ipv6_snapshot = ipv6_loopback_snapshot();
              let canonical_ipv6_socket = SocketAddr::V6(SocketAddrV6::new(
                  Ipv6Addr::LOCALHOST,
                  443,
                  0,
                  0,
              ));
              assert!(
                  ConnectionPlan::new(
                      &ipv6_snapshot,
                      canonical_ipv6_socket,
                      Duration::from_secs(1),
                      1,
                  )
                  .is_ok()
              );
              for (flowinfo, scope_id) in [(1, 0), (0, 1)] {
                  let socket_with_metadata = SocketAddr::V6(SocketAddrV6::new(
                      Ipv6Addr::LOCALHOST,
                      443,
                      flowinfo,
                      scope_id,
                  ));
                  let metadata_error = ConnectionPlan::new(
                      &ipv6_snapshot,
                      socket_with_metadata,
                      Duration::from_secs(1),
                      1,
                  )
                  .expect_err("IPv6 transport metadata requires separate authority");
                  assert!(metadata_error.to_string().contains("zero IPv6 flow and scope"));
                  assert!(metadata_error.source().is_none());
                  assert_eq!(metadata_error.attempt_count(), None);
              }
          '''
          replace_once(marker, addition)
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all

      - name: Verify supported-toolchain contracts
        shell: bash
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps

      - name: Install pinned branch-coverage toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-08-01
          components: llvm-tools-preview

      - name: Verify exact production coverage
        shell: bash
        run: |
          cargo +1.97.1 install cargo-llvm-cov --version 0.8.6 --locked
          cargo +nightly-2026-08-01 llvm-cov \
            --locked \
            --workspace \
            --all-features \
            --branch \
            --json \
            --summary-only \
            --output-path coverage.json
          python3 scripts/ci/verify_coverage.py coverage.json

      - name: Commit verified hardening and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/harden-ipv6-socket-metadata.yml
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add crates/originweave-network/src/connection.rs .github/workflows/harden-ipv6-socket-metadata.yml
          git commit -m "fix: reject unapproved IPv6 socket metadata"
          git push origin HEAD:feat/direct-socket-binding
