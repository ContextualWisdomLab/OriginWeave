name: Bootstrap TLS identity kernel

on:
  push:
    branches:
      - feat/tls-server-identity
    paths:
      - .github/workflows/bootstrap-tls-compile.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-tls-compile
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/tls-server-identity
          fetch-depth: 0

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Add transport-origin error contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/originweave-tls/src/error.rs")
          lines = path.read_text(encoding="utf-8").splitlines()
          if any(line.strip() == "TransportOriginMismatch {" for line in lines):
              raise SystemExit(0)
          def unique_index(predicate, description: str) -> int:
              matches = [index for index, line in enumerate(lines) if predicate(line)]
              if len(matches) != 1:
                  raise SystemExit(f"expected one {description}, found {matches}")
              return matches[0]
          variant_index = unique_index(
              lambda line: line.strip() == "/// The inherited direct TCP evidence or live peer was inconsistent.",
              "inherited peer variant marker",
          )
          indent = lines[variant_index][:-len(lines[variant_index].lstrip())]
          lines[variant_index:variant_index] = [
              f"{indent}/// The TLS origin differed from the origin that authorized the TCP stream.",
              f"{indent}TransportOriginMismatch {{",
              f"{indent}    /// The canonical HTTPS origin requested for TLS authentication.",
              f"{indent}    tls_origin: Origin,",
              f"{indent}    /// The origin recorded by the direct TCP evidence.",
              f"{indent}    transport_origin: Origin,",
              f"{indent}}},",
          ]
          display_index = unique_index(
              lambda line: line.strip() == "Self::InheritedPeerMismatch {",
              "inherited peer display arm",
          )
          display_indent = lines[display_index][:-len(lines[display_index].lstrip())]
          lines[display_index:display_index] = [
              f"{display_indent}Self::TransportOriginMismatch {{",
              f"{display_indent}    tls_origin,",
              f"{display_indent}    transport_origin,",
              f"{display_indent}}} => write!(",
              f"{display_indent}    formatter,",
              f'{display_indent}    "TLS origin {{tls_origin}} does not match TCP authority origin {{transport_origin}}",',
              f"{display_indent}),",
          ]
          source_index = unique_index(
              lambda line: line.strip() == "| Self::InheritedPeerMismatch { .. }",
              "inherited peer source arm",
          )
          source_indent = lines[source_index][:-len(lines[source_index].lstrip())]
          lines[source_index:source_index] = [f"{source_indent}| Self::TransportOriginMismatch {{ .. }}"]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Generate lockfile and capture compile diagnostics
        id: compile
        shell: bash
        run: |
          cargo generate-lockfile
          cargo fmt --all
          set +e
          cargo check --locked --workspace --all-targets > tls-compile-errors.txt 2>&1
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          mkdir -p docs/validation
          if [ "$status" -ne 0 ]; then
            mv tls-compile-errors.txt docs/validation/tls-compile-errors.txt
          else
            rm tls-compile-errors.txt
            rm -f docs/validation/tls-compile-errors.txt
          fi

      - name: Persist failed compile diagnostics
        if: steps.compile.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add -A Cargo.lock crates/originweave-tls docs/validation
          git commit -m "test: capture TLS compile blockers"
          git push origin HEAD:feat/tls-server-identity
          exit 1

      - name: Capture test, Clippy, and rustdoc diagnostics
        if: steps.compile.outputs.status == '0'
        id: verify
        shell: bash
        run: |
          set +e
          {
            cargo fmt --all --check
            cargo test --locked -p originweave-tls --all-targets
            cargo clippy --locked -p originweave-tls --all-targets -- -D warnings
            RUSTDOCFLAGS='-D warnings' cargo doc --locked -p originweave-tls --no-deps
          } > tls-verification-errors.txt 2>&1
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          mkdir -p docs/validation
          if [ "$status" -ne 0 ]; then
            mv tls-verification-errors.txt docs/validation/tls-verification-errors.txt
          else
            rm tls-verification-errors.txt
            rm -f docs/validation/tls-verification-errors.txt
          fi

      - name: Persist failed verification diagnostics
        if: steps.compile.outputs.status == '0' && steps.verify.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add -A Cargo.lock crates/originweave-tls docs/validation
          git commit -m "test: capture TLS verification blockers"
          git push origin HEAD:feat/tls-server-identity
          exit 1

      - name: Commit compiled bootstrap and remove one-shot workflow
        if: steps.compile.outputs.status == '0' && steps.verify.outputs.status == '0'
        shell: bash
        run: |
          rm .github/workflows/bootstrap-tls-compile.yml
          rm -f docs/validation/tls-compile-errors.txt docs/validation/tls-verification-errors.txt
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add -A Cargo.lock crates/originweave-tls docs/validation .github/workflows/bootstrap-tls-compile.yml
          git commit -m "feat: establish TLS identity kernel contracts"
          git push origin HEAD:feat/tls-server-identity
