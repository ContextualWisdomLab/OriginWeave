name: Repair HTTP transport-failure coverage

on:
  push:
    branches:
      - feat/http11-semantics
    paths:
      - .github/workflows/repair-http-transport-flake.yml

permissions:
  contents: write

concurrency:
  group: repair-http-transport-failure-coverage
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/http11-semantics
          fetch-depth: 0

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Install pinned coverage toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-08-01 --profile minimal --component llvm-tools-preview
          cargo +1.97.1 install cargo-llvm-cov --version 0.8.6 --locked

      - name: Make transport failure deterministic and normalize DEL predicates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("crates/originweave-http/src/disposition.rs")
          source = source_path.read_text(encoding="utf-8")
          redundant_del_check = " || byte == 0x7f"
          count = source.count(redundant_del_check)
          if count not in {0, 3}:
              raise SystemExit(f"expected zero or three redundant DEL checks, found {count}")
          if count == 3:
              source_path.write_text(
                  source.replace(redundant_del_check, ""),
                  encoding="utf-8",
              )

          test_path = Path("crates/originweave-http/tests/transport_failure_integration.rs")
          test = test_path.read_text(encoding="utf-8")
          before = '''    let mut connection = authenticated_connection(&origin, socket_address, root_der);
              connection
                  .stream_mut()
                  .sock
                  .shutdown(Shutdown::Write)
                  .expect("locally shut down write half");
              let target = HttpRequestTarget::parse(origin, "/write-failure").expect("target");

              let result = HttpExchangePlan::new(
                  connection,
                  HttpMethod::Get,
                  target,
                  &[],
                  HttpClientPolicy::strict_defaults(),
              )
              .expect("HTTP exchange plan")
              .execute();
          '''
          after = '''    let connection = authenticated_connection(&origin, socket_address, root_der);
              let shutdown_handle = connection
                  .stream()
                  .sock
                  .try_clone()
                  .expect("clone socket handle for deterministic half-close");
              let target = HttpRequestTarget::parse(origin, "/write-failure").expect("target");
              let plan = HttpExchangePlan::new(
                  connection,
                  HttpMethod::Get,
                  target,
                  &[],
                  HttpClientPolicy::strict_defaults(),
              )
              .expect("HTTP exchange plan");

              shutdown_handle
                  .shutdown(Shutdown::Write)
                  .expect("locally shut down write half after authority validation");
              let result = plan.execute();
          '''
          if test.count(before) != 1:
              raise SystemExit(
                  f"expected one transport-failure fixture, found {test.count(before)}"
              )
          test_path.write_text(test.replace(before, after, 1), encoding="utf-8")
          PY
          cargo fmt --all

      - name: Verify exact maintained branch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          cargo +nightly-2026-08-01 llvm-cov \
            --locked \
            --workspace \
            --all-features \
            --branch \
            --json \
            --output-path coverage.json
          if ! python3 scripts/ci/verify_coverage.py coverage.json; then
            cargo +nightly-2026-08-01 llvm-cov report \
              --branch \
              --text \
              --show-missing-lines \
              > missing-lines.txt
            cat missing-lines.txt
            exit 1
          fi

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-http-transport-flake.yml
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add \
            crates/originweave-http/src/disposition.rs \
            crates/originweave-http/tests/transport_failure_integration.rs \
            .github/workflows/repair-http-transport-flake.yml
          git commit -m "test(http): make transport failures deterministic"
          git push origin HEAD:feat/http11-semantics
