name: Repair HTTP reachability contracts

on:
  push:
    branches:
      - feat/http11-semantics
    paths:
      - .github/workflows/repair-http-reachability.yml

permissions:
  contents: write

concurrency:
  group: repair-http-reachability
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/http11-semantics
          fetch-depth: 0

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Install pinned coverage toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-08-01 --profile minimal --component llvm-tools-preview
          cargo +1.97.1 install cargo-llvm-cov --version 0.8.6 --locked

      - name: Repair impossible test fixtures and redundant branches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tests_path = Path("crates/originweave-http/src/tests/reachability_contract.rs")
          tests = tests_path.read_text(encoding="utf-8")
          test_replacements = [
              (
                  "fn disposition_rejects_quoted_and_extended_filename_edge_classes()",
                  "fn disposition_rejects_quoted_control_and_extended_filename_edge_classes()",
              ),
              (
                  r'b"attachment; filename=\"a\\\x7fb\""',
                  r'b"attachment; filename=\"a\\\tb\""',
              ),
              (
                  r'b"attachment; filename=\"a\x7fb\""',
                  r'b"attachment; filename=\"a\tb\""',
              ),
              (
                  "fn redirect_metadata_rejects_delete_and_fragment_bytes()",
                  "fn redirect_metadata_rejects_internal_whitespace_and_fragment_bytes()",
              ),
              (
                  r'b"/next\x7f".as_slice()',
                  r'b"/ne\txt".as_slice()',
              ),
          ]
          for before, after in test_replacements:
              count = tests.count(before)
              if count != 1:
                  raise SystemExit(f"expected one test marker {before!r}, found {count}")
              tests = tests.replace(before, after, 1)
          tests_path.write_text(tests, encoding="utf-8")

          source_path = Path("crates/originweave-http/src/disposition.rs")
          source = source_path.read_text(encoding="utf-8")
          redundant_del_check = " || byte == 0x7f"
          count = source.count(redundant_del_check)
          if count != 3:
              raise SystemExit(f"expected three redundant DEL checks, found {count}")
          source_path.write_text(
              source.replace(redundant_del_check, ""),
              encoding="utf-8",
          )
          PY
          cargo fmt --all

      - name: Verify exact maintained branch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          cargo +nightly-2026-08-01 llvm-cov \
            --locked \
            --workspace \
            --all-features \
            --branch \
            --json \
            --output-path coverage.json
          if ! python3 scripts/ci/verify_coverage.py coverage.json; then
            cargo +nightly-2026-08-01 llvm-cov report \
              --branch \
              --text \
              --show-missing-lines \
              > missing-lines.txt
            cat missing-lines.txt
            exit 1
          fi

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-http-reachability.yml
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add \
            crates/originweave-http/src/disposition.rs \
            crates/originweave-http/src/tests/reachability_contract.rs \
            .github/workflows/repair-http-reachability.yml
          git commit -m "test(http): use reachable control-byte contracts"
          git push origin HEAD:feat/http11-semantics
