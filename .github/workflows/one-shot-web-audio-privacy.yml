name: One-shot Web Audio privacy materializer

on:
  push:
    branches:
      - feat/block-web-audio-fingerprinting
    paths:
      - .github/workflows/one-shot-web-audio-privacy.yml

permissions:
  contents: write

concurrency:
  group: one-shot-web-audio-privacy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/block-web-audio-fingerprinting
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Apply exact-anchor materialization
        run: python3 scripts/ci/materialize_web_audio_privacy.py
      - name: Format and verify the materialized slice
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          git diff --check
      - name: Commit the verified one-shot result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "materializer produced no reviewed change" >&2
            exit 1
          }
          git commit -m "feat(privacy): enforce default-deny Web Audio policy"
          git push origin "HEAD:${GITHUB_REF_NAME}"
