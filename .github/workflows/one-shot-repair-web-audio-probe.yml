name: One-shot Web Audio probe repair

# Retry 2: allow the pinned Rust toolchain distribution endpoint.
on:
  push:
    branches:
      - feat/block-web-audio-fingerprinting
    paths:
      - .github/workflows/one-shot-repair-web-audio-probe.yml

permissions:
  contents: write

concurrency:
  group: one-shot-repair-web-audio-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner and block undeclared egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.rust-lang.org:443
            storage.googleapis.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            results-receiver.actions.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/block-web-audio-fingerprinting
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Apply exact-anchor probe repair
        run: python3 scripts/ci/repair_web_audio_privacy_probe.py

      - name: Verify repository contracts and Rust workspace
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          git diff --check

      - name: Download exact Chrome for Testing pair
        env:
          CHROME_VERSION: "150.0.7871.129"
        run: |
          set -euo pipefail
          base="https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output chrome-linux64.zip "${base}/chrome-linux64.zip"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output chromedriver-linux64.zip "${base}/chromedriver-linux64.zip"
          mkdir -p .privacy-browser
          unzip -q chrome-linux64.zip -d .privacy-browser
          unzip -q chromedriver-linux64.zip -d .privacy-browser
          chmod 0755 \
            .privacy-browser/chrome-linux64/chrome \
            .privacy-browser/chromedriver-linux64/chromedriver

      - name: Prove repaired policy in real Chromium
        env:
          CHROME_BIN: ${{ github.workspace }}/.privacy-browser/chrome-linux64/chrome
          CHROMEDRIVER_BIN: ${{ github.workspace }}/.privacy-browser/chromedriver-linux64/chromedriver
        run: python3 scripts/ci/run_web_audio_privacy.py | tee web-audio-privacy-repair.json

      - name: Commit verified non-workflow repair
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/one-shot-repair-web-audio-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "probe repair produced no reviewed non-workflow change" >&2
            exit 1
          }
          git commit -m "fix(privacy): accept absent legacy Web Audio aliases"
          git push origin "HEAD:${GITHUB_REF_NAME}"
