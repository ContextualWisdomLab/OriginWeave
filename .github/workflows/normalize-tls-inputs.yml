name: Normalize concrete TLS inputs

on:
  push:
    branches:
      - feat/tls-server-identity
    paths:
      - .github/workflows/normalize-tls-inputs.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/tls-server-identity
          fetch-depth: 0

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Normalize remaining concrete call sites
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/originweave-tls/tests/handshake_integration.rs")
          text = path.read_text(encoding="utf-8")
          before = """        [root_der],
          """
          after = """        vec![root_der],
          """
          if text.count(before) != 1:
              raise SystemExit(f"expected one root-vector marker, found {text.count(before)}")
          path.write_text(text.replace(before, after, 1), encoding="utf-8")
          PY
          cargo fmt --all

      - name: Verify exact branch
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps

      - name: Commit verified normalization and remove one-shot workflow
        run: |
          rm .github/workflows/normalize-tls-inputs.yml
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add -A crates/originweave-tls .github/workflows/normalize-tls-inputs.yml
          git commit -m "refactor: normalize bounded TLS input APIs"
          git push origin HEAD:feat/tls-server-identity
