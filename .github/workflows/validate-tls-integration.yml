name: Validate TLS integration suite

on:
  push:
    branches:
      - feat/tls-server-identity
    paths:
      - .github/workflows/validate-tls-integration.yml

permissions:
  contents: write

concurrency:
  group: validate-tls-integration
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/tls-server-identity
          fetch-depth: 0

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Format and validate exact branch
        id: validation
        shell: bash
        run: |
          cargo fmt --all
          set +e
          {
            python3 -m compileall -q scripts tests
            python3 -m unittest discover -s tests -p 'test_*.py'
            cargo fmt --all --check
            cargo check --locked --workspace --all-targets
            cargo test --locked --workspace --all-targets
            cargo clippy --locked --workspace --all-targets -- -D warnings
            RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          } > tls-integration-validation.txt 2>&1
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          mkdir -p docs/validation
          if [ "$status" -ne 0 ]; then
            mv tls-integration-validation.txt docs/validation/tls-integration-errors.txt
          else
            rm tls-integration-validation.txt
            rm -f docs/validation/tls-integration-errors.txt
          fi

      - name: Persist failure diagnostics
        if: steps.validation.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add -A crates/originweave-tls docs/validation
          git commit -m "test: capture TLS integration blockers"
          git push origin HEAD:feat/tls-server-identity
          exit 1

      - name: Commit verified integration suite and remove one-shot workflow
        if: steps.validation.outputs.status == '0'
        shell: bash
        run: |
          rm .github/workflows/validate-tls-integration.yml
          rm -f docs/validation/tls-integration-errors.txt
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add -A crates/originweave-tls docs/validation .github/workflows/validate-tls-integration.yml
          git commit -m "test: verify real TLS identity handshakes"
          git push origin HEAD:feat/tls-server-identity
