name: Format HTTP transport tests

on:
  push:
    branches:
      - feat/http11-semantics
    paths:
      - .github/workflows/format-http-transport-tests.yml

permissions:
  contents: write

concurrency:
  group: format-http-transport-tests
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/http11-semantics
          fetch-depth: 0

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Apply canonical formatting and verify contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps

      - name: Commit verified formatting and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-http-transport-tests.yml
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add \
            crates/originweave-http/tests/transport_failure_integration.rs \
            .github/workflows/format-http-transport-tests.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(http): format transport failure contracts"
          git push origin HEAD:feat/http11-semantics
