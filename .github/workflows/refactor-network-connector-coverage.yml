name: Refactor network connector coverage path

on:
  push:
    branches:
      - feat/direct-socket-binding
    paths:
      - .github/workflows/refactor-network-connector-coverage.yml

permissions:
  contents: write

concurrency:
  group: refactor-network-connector-coverage
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/direct-socket-binding
          fetch-depth: 0

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Replace generic connector with object-safe exact-stream adapter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/originweave-network/src/connection.rs")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          replace_once("fn connect_with<C: SocketConnector>(", "fn connect_with(")
          replace_once("connector: &C,", "connector: &dyn SocketConnector,")
          replace_once(
              "Result<(C::Stream, SocketConnectionEvidence), NetworkError>",
              "Result<(TcpStream, SocketConnectionEvidence), NetworkError>",
          )
          replace_once("    type Stream;\n\n", "")
          replace_once("    type Stream = TcpStream;\n\n", "")
          replace_once("        type Stream = u8;\n\n", "")
          text = text.replace("io::Result<Self::Stream>", "io::Result<TcpStream>")
          text = text.replace("&Self::Stream", "&TcpStream")
          replace_once(
              "use std::net::{IpAddr, Ipv4Addr};",
              "use std::net::{IpAddr, Ipv4Addr, TcpListener};",
          )
          replace_once("Success(u8),", "Success(TcpStream),")

          pattern = re.compile(
              r"(?P<indent>\s*)fn requested_socket\(\) -> SocketAddr \{\n"
              r"(?P=indent)    SocketAddr::new\(IpAddr::V4\(Ipv4Addr::LOCALHOST\), 8080\)\n"
              r"(?P=indent)\}\n"
          )
          match = pattern.search(text)
          if match is None:
              raise SystemExit("requested_socket helper was not found")
          indent = match.group("indent")
          requested_socket = match.group(0)
          connected_stream = (
              requested_socket
              + "\n"
              + indent
              + "fn connected_stream() -> TcpStream {\n"
              + indent
              + "    let listener = TcpListener::bind((Ipv4Addr::LOCALHOST, 0))\n"
              + indent
              + '        .expect("test listener must bind");\n'
              + indent
              + '    let socket_address = listener.local_addr().expect("listener address");\n'
              + indent
              + "    let client = TcpStream::connect_timeout(&socket_address, Duration::from_secs(1))\n"
              + indent
              + '        .expect("test client must connect");\n'
              + indent
              + '    let (_server, _peer) = listener.accept().expect("listener must accept");\n'
              + indent
              + "    client\n"
              + indent
              + "}\n"
          )
          text = text[: match.start()] + connected_stream + text[match.end() :]

          replace_once(
              "ConnectOutcome::Success(7)",
              "ConnectOutcome::Success(connected_stream())",
          )
          success_one_count = text.count("ConnectOutcome::Success(1)")
          if success_one_count != 2:
              raise SystemExit(
                  f"expected two remaining fake success values, found {success_one_count}"
              )
          text = text.replace(
              "ConnectOutcome::Success(1)",
              "ConnectOutcome::Success(connected_stream())",
          )
          replace_once(
              "let (stream, evidence) = plan(2)",
              "let (_stream, evidence) = plan(2)",
          )
          replace_once("        assert_eq!(stream, 7);\n", "")

          if "C::Stream" in text or "Self::Stream" in text or "type Stream" in text:
              raise SystemExit("generic connector stream type remains")

          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all

      - name: Verify supported-toolchain contracts
        shell: bash
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps

      - name: Install pinned branch-coverage toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-08-01
          components: llvm-tools-preview

      - name: Measure exact production coverage
        shell: bash
        run: |
          cargo +1.97.1 install cargo-llvm-cov --version 0.8.6 --locked
          cargo +nightly-2026-08-01 llvm-cov \
            --locked \
            --workspace \
            --all-features \
            --branch \
            --json \
            --summary-only \
            --output-path coverage.json
          cargo +nightly-2026-08-01 llvm-cov report \
            --branch \
            --text \
            --show-missing-lines \
            > missing-lines.txt
          cp crates/originweave-network/src/connection.rs transformed-connection.rs

      - name: Upload transformed coverage diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: transformed-network-coverage-${{ github.sha }}
          path: |
            coverage.json
            missing-lines.txt
            transformed-connection.rs
          if-no-files-found: error
          retention-days: 3

      - name: Enforce exact production coverage
        run: python3 scripts/ci/verify_coverage.py coverage.json

      - name: Commit verified refactor and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/refactor-network-connector-coverage.yml
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add crates/originweave-network/src/connection.rs .github/workflows/refactor-network-connector-coverage.yml
          git commit -m "refactor: remove generic connector coverage gaps"
          git push origin HEAD:feat/direct-socket-binding
