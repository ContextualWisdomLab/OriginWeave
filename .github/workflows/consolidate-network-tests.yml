name: Consolidate network tests deterministically

on:
  push:
    branches:
      - feat/direct-socket-binding
    paths:
      - .github/workflows/consolidate-network-tests.yml

permissions:
  contents: write

concurrency:
  group: consolidate-network-tests
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/direct-socket-binding
          fetch-depth: 0

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Consolidate direct network verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/originweave-network/src/connection.rs")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          replace_once("fn connect_with<C: SocketConnector>(", "fn connect_with(")
          replace_once("connector: &C,", "connector: &dyn SocketConnector,")
          replace_once(
              "Result<(C::Stream, SocketConnectionEvidence), NetworkError>",
              "Result<(TcpStream, SocketConnectionEvidence), NetworkError>",
          )
          replace_once("    type Stream;\n\n", "")
          replace_once("    type Stream = TcpStream;\n\n", "")
          replace_once("        type Stream = u8;\n\n", "")
          text = text.replace("io::Result<Self::Stream>", "io::Result<TcpStream>")
          text = text.replace("&Self::Stream", "&TcpStream")
          replace_once(
              "    use std::error::Error;\n",
              "    use std::error::Error;\n    use std::io::{Read, Write};\n",
          )
          replace_once(
              "    use std::net::{IpAddr, Ipv4Addr};",
              "    use std::net::{IpAddr, Ipv4Addr, Ipv6Addr, TcpListener};\n    use std::thread;",
          )
          replace_once("Success(u8),", "Success(TcpStream),")

          requested_pattern = re.compile(
              r"(?P<indent>^[ ]*)fn requested_socket\(\) -> SocketAddr \{\n"
              r"(?P=indent)    SocketAddr::new\(IpAddr::V4\(Ipv4Addr::LOCALHOST\), 8080\)\n"
              r"(?P=indent)\}\n",
              re.MULTILINE,
          )
          requested_match = requested_pattern.search(text)
          if requested_match is None:
              raise SystemExit("requested_socket helper not found")
          indent = requested_match.group("indent")
          requested_block = requested_match.group(0)
          connected_block = requested_block + (
              "\n"
              f"{indent}fn connected_stream() -> TcpStream {{\n"
              f"{indent}    let listener = TcpListener::bind((Ipv4Addr::LOCALHOST, 0))\n"
              f"{indent}        .expect(\"test listener must bind\");\n"
              f"{indent}    let socket_address = listener.local_addr().expect(\"listener address\");\n"
              f"{indent}    let client = TcpStream::connect_timeout(&socket_address, Duration::from_secs(1))\n"
              f"{indent}        .expect(\"test client must connect\");\n"
              f"{indent}    let (_server, _peer) = listener.accept().expect(\"listener must accept\");\n"
              f"{indent}    client\n"
              f"{indent}}}\n"
          )
          text = (
              text[: requested_match.start()]
              + connected_block
              + text[requested_match.end() :]
          )

          replace_once(
              "ConnectOutcome::Success(7)",
              "ConnectOutcome::Success(connected_stream())",
          )
          if text.count("ConnectOutcome::Success(1)") != 2:
              raise SystemExit("expected two one-valued fake stream outcomes")
          text = text.replace(
              "ConnectOutcome::Success(1)",
              "ConnectOutcome::Success(connected_stream())",
          )
          replace_once(
              "let (stream, evidence) = plan(2)",
              "let (_stream, evidence) = plan(2)",
          )
          replace_once("        assert_eq!(stream, 7);\n", "")

          plan_pattern = re.compile(
              r"^[ ]{4}fn plan\(maximum_attempts: u8\) -> ConnectionPlan \{\n"
              r".*?"
              r"^[ ]{4}\}\n",
              re.MULTILINE | re.DOTALL,
          )
          plan_match = plan_pattern.search(text)
          if plan_match is None:
              raise SystemExit("plan helper not found")
          plan_replacement = '''    fn loopback_snapshot() -> ResolutionSnapshot {
              ResolutionSnapshot::approve(
                  Origin::parse("http://localhost").expect("loopback origin"),
                  [IpAddr::V4(Ipv4Addr::LOCALHOST)],
                  &DestinationPolicy::from_allowed_classes([AddressClass::Loopback]),
              )
              .expect("managed loopback snapshot")
          }

              fn plan(maximum_attempts: u8) -> ConnectionPlan {
                  ConnectionPlan::new(
                      &loopback_snapshot(),
                      requested_socket(),
                      Duration::from_secs(2),
                      maximum_attempts,
                  )
                  .expect("valid connection plan")
              }
          '''
          text = text[: plan_match.start()] + plan_replacement + text[plan_match.end() :]

          additional_tests = r'''

              #[test]
              fn validation_errors_cover_every_public_contract() {
                  let snapshot = loopback_snapshot();
                  let socket = SocketAddr::new(IpAddr::V4(Ipv4Addr::LOCALHOST), 80);
                  let validation_errors = [
                      ConnectionPlan::new(
                          &snapshot,
                          SocketAddr::new(IpAddr::V4(Ipv4Addr::LOCALHOST), 0),
                          Duration::from_secs(1),
                          1,
                      )
                      .expect_err("port zero must fail"),
                      ConnectionPlan::new(&snapshot, socket, Duration::ZERO, 1)
                          .expect_err("zero timeout must fail"),
                      ConnectionPlan::new(
                          &snapshot,
                          socket,
                          MAX_CONNECT_TIMEOUT + Duration::from_nanos(1),
                          1,
                      )
                      .expect_err("excessive timeout must fail"),
                      ConnectionPlan::new(&snapshot, socket, Duration::from_secs(1), 0)
                          .expect_err("zero attempts must fail"),
                      ConnectionPlan::new(
                          &snapshot,
                          socket,
                          Duration::from_secs(1),
                          MAX_CONNECTION_ATTEMPTS + 1,
                      )
                      .expect_err("excessive attempts must fail"),
                  ];
                  for error in validation_errors {
                      assert!(!error.to_string().is_empty());
                      assert!(error.source().is_none());
                      assert_eq!(error.attempt_count(), None);
                  }

                  let denied_socket =
                      SocketAddr::new(IpAddr::V4(Ipv4Addr::new(1, 1, 1, 1)), 443);
                  let denied = ConnectionPlan::new(
                      &snapshot,
                      denied_socket,
                      Duration::from_secs(1),
                      1,
                  )
                  .expect_err("address absent from snapshot must fail");
                  assert!(denied.to_string().contains("not approved"));
                  assert!(denied.source().is_some());
                  assert_eq!(denied.attempt_count(), None);

                  let mapped = Ipv6Addr::new(0, 0, 0, 0, 0, 0xffff, 0x7f00, 1);
                  let noncanonical = ConnectionPlan::new(
                      &snapshot,
                      SocketAddr::new(IpAddr::V6(mapped), 443),
                      Duration::from_secs(1),
                      1,
                  )
                  .expect_err("mapped address must fail canonical authority");
                  assert!(noncanonical.to_string().contains("canonical"));
                  assert!(noncanonical.source().is_none());
                  assert_eq!(noncanonical.attempt_count(), None);
              }

              #[test]
              fn public_destination_policy_denies_loopback_before_network_authority() {
                  let error = ResolutionSnapshot::approve(
                      Origin::parse("https://example.com").expect("public origin"),
                      [IpAddr::V4(Ipv4Addr::LOCALHOST)],
                      &DestinationPolicy::public_web(),
                  )
                  .expect_err("public policy must deny loopback");
                  assert!(error.to_string().contains("denied as Loopback"));
              }

              #[test]
              fn approved_loopback_socket_becomes_the_exact_operating_system_peer() {
                  let listener =
                      TcpListener::bind((Ipv4Addr::LOCALHOST, 0)).expect("listener must bind");
                  let socket = listener.local_addr().expect("listener address");
                  let server = thread::spawn(move || {
                      let (mut stream, _) = listener.accept().expect("listener must accept");
                      stream.write_all(b"ok").expect("server response must write");
                  });

                  let origin = Origin::parse("http://localhost").expect("loopback origin");
                  let snapshot = loopback_snapshot();
                  let connection = ConnectionPlan::new(
                      &snapshot,
                      socket,
                      Duration::from_secs(1),
                      1,
                  )
                  .expect("plan must validate")
                  .connect()
                  .expect("exact loopback peer must connect");

                  assert_eq!(connection.stream().peer_addr().expect("peer address"), socket);
                  assert_eq!(connection.evidence().origin(), &origin);
                  assert_eq!(connection.evidence().requested_socket(), socket);
                  assert_eq!(connection.evidence().observed_peer(), socket);
                  assert_eq!(connection.evidence().address_class(), AddressClass::Loopback);
                  assert_eq!(connection.evidence().attempt_number(), 1);
                  assert_eq!(connection.evidence().connect_timeout(), Duration::from_secs(1));

                  let (mut stream, evidence) = connection.into_parts();
                  let mut body = [0_u8; 2];
                  stream.read_exact(&mut body).expect("response must read");
                  assert_eq!(&body, b"ok");
                  assert_eq!(evidence.observed_peer(), socket);
                  server.join().expect("server thread must finish");
              }

              #[test]
              fn refused_loopback_connection_stops_at_the_exact_attempt_bound() {
                  let listener =
                      TcpListener::bind((Ipv4Addr::LOCALHOST, 0)).expect("port must reserve");
                  let socket = listener.local_addr().expect("reserved address");
                  drop(listener);

                  let error = ConnectionPlan::new(
                      &loopback_snapshot(),
                      socket,
                      Duration::from_secs(1),
                      3,
                  )
                  .expect("plan must validate")
                  .connect()
                  .expect_err("closed loopback port must fail");

                  assert_eq!(error.attempt_count(), Some(3));
                  assert!(error.source().is_some());
                  assert!(error.to_string().contains("failed after 3 attempts"));
              }
          '''
          if not text.endswith("\n}\n"):
              raise SystemExit("connection module does not end with test-module brace")
          text = text[:-3] + additional_tests + "\n}\n"

          forbidden = ("C::Stream", "Self::Stream", "type Stream")
          if any(marker in text for marker in forbidden):
              raise SystemExit("generic connector stream type remains")

          path.write_text(text, encoding="utf-8")
          PY
          rm -rf crates/originweave-network/tests
          cargo fmt --all

      - name: Verify supported-toolchain contracts
        shell: bash
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps

      - name: Install pinned branch-coverage toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-08-01
          components: llvm-tools-preview

      - name: Verify exact production coverage
        shell: bash
        run: |
          cargo +1.97.1 install cargo-llvm-cov --version 0.8.6 --locked
          cargo +nightly-2026-08-01 llvm-cov \
            --locked \
            --workspace \
            --all-features \
            --branch \
            --json \
            --summary-only \
            --output-path coverage.json
          python3 scripts/ci/verify_coverage.py coverage.json

      - name: Commit verified consolidation and remove one-shot workflows
        shell: bash
        run: |
          rm .github/workflows/consolidate-network-tests.yml
          rm .github/workflows/refactor-network-connector-coverage.yml
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add -A crates/originweave-network .github/workflows
          git commit -m "test: consolidate direct socket verification"
          git push origin HEAD:feat/direct-socket-binding
