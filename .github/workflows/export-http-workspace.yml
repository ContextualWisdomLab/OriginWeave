name: Export HTTP workspace

on:
  pull_request:
    paths:
      - .github/workflows/export-http-workspace.yml

permissions:
  contents: read

concurrency:
  group: export-http-workspace-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export:
    name: Export exact source and vendored dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Vendor locked dependencies
        run: |
          cargo vendor --locked vendor
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "vendor"
          EOF
      - name: Package exact workspace
        run: |
          tar \
            --exclude=.git \
            --exclude=target \
            -czf /tmp/originweave-http-workspace.tar.gz .
          sha256sum /tmp/originweave-http-workspace.tar.gz > /tmp/originweave-http-workspace.sha256
      - name: Upload exact workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: originweave-http-workspace-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/originweave-http-workspace.tar.gz
            /tmp/originweave-http-workspace.sha256
          if-no-files-found: error
          retention-days: 3
