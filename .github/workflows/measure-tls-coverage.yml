name: Measure TLS production coverage

# Exact-head retry with crate-scoped diagnostics.
on:
  push:
    branches:
      - feat/tls-server-identity
    paths:
      - .github/workflows/measure-tls-coverage.yml
      - crates/originweave-tls/**

permissions:
  contents: write

concurrency:
  group: measure-tls-coverage
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/tls-server-identity
          fetch-depth: 0

      - name: Install pinned coverage toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-08-01
          components: llvm-tools-preview

      - name: Install pinned cargo-llvm-cov
        run: cargo +1.97.1 install cargo-llvm-cov --version 0.8.6 --locked

      - name: Measure exact workspace coverage
        id: coverage
        shell: bash
        run: |
          cargo +nightly-2026-08-01 llvm-cov \
            --locked \
            --workspace \
            --all-features \
            --branch \
            --json \
            --output-path coverage.json
          cargo +nightly-2026-08-01 llvm-cov report \
            --branch \
            --text \
            --show-missing-lines \
            > all-missing-lines.txt
          set +e
          python3 scripts/ci/verify_coverage.py coverage.json
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          marker = "/crates/originweave-tls/src/"
          payload = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          export = payload["data"][0]
          totals = export["totals"]
          summary = [
              "# Exact coverage summary",
              "",
              *[
                  f"- {name}: {totals[name]['covered']}/{totals[name]['count']} ({totals[name]['percent']:.6f}%)"
                  for name in ("functions", "lines", "regions", "branches")
              ],
              "",
              "## Uncovered TLS production functions",
              "",
          ]
          uncovered_functions = []
          for function in export.get("functions", []):
              filenames = function.get("filenames", [])
              if function.get("count") == 0 and any(marker in name for name in filenames):
                  uncovered_functions.append(function.get("name", "<unnamed>"))
          if uncovered_functions:
              summary.extend(f"- `{name}`" for name in sorted(set(uncovered_functions)))
          else:
              summary.append("- None")
          summary.append("")
          Path("coverage-summary.md").write_text("\n".join(summary), encoding="utf-8")

          text = Path("all-missing-lines.txt").read_text(encoding="utf-8")
          sections = re.split(r"(?=^/.*:$)", text, flags=re.MULTILINE)
          selected = [section.rstrip() for section in sections if marker in section.splitlines()[0]]
          if not selected:
              raise SystemExit("no TLS source sections found in llvm-cov text report")
          Path("tls-missing-lines.txt").write_text(
              "\n\n".join(selected) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Persist uncovered diagnostics
        if: steps.coverage.outputs.status != '0'
        shell: bash
        run: |
          mkdir -p docs/validation
          mv coverage-summary.md docs/validation/tls-coverage-summary.md
          mv tls-missing-lines.txt docs/validation/tls-missing-lines.txt
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add docs/validation/tls-coverage-summary.md docs/validation/tls-missing-lines.txt
          git commit -m "test: compact uncovered TLS contracts"
          git push origin HEAD:feat/tls-server-identity
          exit 1

      - name: Remove one-shot workflow after exact coverage
        if: steps.coverage.outputs.status == '0'
        shell: bash
        run: |
          rm .github/workflows/measure-tls-coverage.yml
          rm -f docs/validation/tls-coverage-summary.md docs/validation/tls-missing-lines.txt
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add -A .github/workflows/measure-tls-coverage.yml docs/validation
          git commit -m "test: prove exact TLS production coverage"
          git push origin HEAD:feat/tls-server-identity
