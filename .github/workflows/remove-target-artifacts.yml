name: Remove accidental Rust build artifacts

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: remove-target-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'feat/agent-safety-kernel'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/agent-safety-kernel
          fetch-depth: 1
          persist-credentials: false
      - name: Remove generated artifacts and self-delete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm -r target
          cat >.gitignore <<'EOF'
          /target/
          **/*.rs.bk
          .DS_Store
          EOF
          rm .github/workflows/remove-target-artifacts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore .github/workflows/remove-target-artifacts.yml
          git diff --cached --check
          git commit -m 'chore: remove generated Rust build artifacts'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/agent-safety-kernel
