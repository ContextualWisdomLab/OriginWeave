name: Refresh TLS lock and typed integration contracts

on:
  push:
    branches:
      - feat/tls-server-identity
    paths:
      - .github/workflows/refresh-tls-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-tls-lock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/tls-server-identity
          fetch-depth: 0

      - name: Install supported Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Apply deterministic TLS repair
        shell: bash
        run: |
          python3 scripts/ci/repair_tls_branch.py
          cargo generate-lockfile
          cargo fmt --all

      - name: Verify exact maintained branch
        shell: bash
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps

      - name: Commit verified repair and remove one-shot helpers
        shell: bash
        run: |
          rm .github/workflows/refresh-tls-lock.yml
          rm -f .github/workflows/diagnose-tls-errors.yml
          rm scripts/ci/repair_tls_branch.py
          git config user.name "OpenCode Repair Agent"
          git config user.email "opencode-repair@users.noreply.github.com"
          git add -A Cargo.lock crates/originweave-tls docs/adr/0006-tls-server-identity.md scripts/ci/repair_tls_branch.py .github/workflows/refresh-tls-lock.yml .github/workflows/diagnose-tls-errors.yml
          git commit -m "fix: type TLS identity and ALPN failures"
          git push origin HEAD:feat/tls-server-identity
