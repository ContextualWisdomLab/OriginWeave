name: Export exact source snapshot

on:
  push:
    branches:
      - feat/tls-server-identity
    paths:
      - .github/workflows/export-source-snapshot.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/tls-server-identity
          fetch-depth: 0

      - name: Create deterministic source archive
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude='**/__pycache__' \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf originweave-source.tar.gz .
          sha256sum originweave-source.tar.gz > originweave-source.sha256

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-snapshot-${{ github.sha }}
          path: |
            originweave-source.tar.gz
            originweave-source.sha256
          if-no-files-found: error
          retention-days: 1
