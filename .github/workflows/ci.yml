name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Classify CI scope
    runs-on: ubuntu-24.04
    outputs:
      documentation_only: ${{ steps.scope.outputs.documentation_only }}
      rust_required: ${{ steps.scope.outputs.rust_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Classify exact changed objects
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            printf 'documentation_only=false\nrust_required=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          test -n "${BASE_SHA}"
          test -n "${HEAD_SHA}"
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git diff --raw -z --no-abbrev "${BASE_SHA}" "${HEAD_SHA}" |
            python3 scripts/ci/classify_ci_change_scope.py >> "${GITHUB_OUTPUT}"

  contracts:
    name: Repository and documentation contracts
    needs: scope
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check Python repository contracts
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'

  rust:
    name: Rust contracts
    needs: [scope, contracts]
    if: needs.scope.outputs.rust_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Check formatting
        id: formatting
        run: cargo fmt --all --check
      - name: Materialize canonical Rust formatting diagnostics
        if: failure() && steps.formatting.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          mkdir -p rustfmt-output
          git diff --output=rustfmt-output/rustfmt.patch -- '*.rs'
          while IFS= read -r source_file; do
            [ -n "$source_file" ] || continue
            install -D -m 0644 "$source_file" "rustfmt-output/$source_file"
          done < <(git diff --name-only -- '*.rs')
      - name: Upload canonical Rust formatting diagnostics
        if: failure() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustfmt-${{ github.event.pull_request.head.sha || github.sha }}
          path: rustfmt-output
          if-no-files-found: error
          retention-days: 3
      - name: Run tests
        run: cargo test --locked --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  coverage:
    name: Production coverage
    needs: [scope, contracts]
    if: needs.scope.outputs.rust_required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-08-18
          components: llvm-tools-preview
      - name: Install pinned cargo-llvm-cov
        run: cargo +1.97.1 install cargo-llvm-cov --version 0.8.6 --locked
      - name: Measure production functions, lines, regions, and branches
        run: >-
          cargo +nightly-2026-08-18 llvm-cov
          --locked
          --workspace
          --all-features
          --branch
          --json
          --output-path coverage.json
      - name: Record uncovered production lines
        run: >-
          cargo +nightly-2026-08-18 llvm-cov report
          --branch
          --text
          --show-missing-lines
          > missing-lines.txt
      - name: Upload exact coverage diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            coverage.json
            missing-lines.txt
          if-no-files-found: error
          retention-days: 3
      - name: Enforce exact production coverage
        run: python3 scripts/ci/verify_coverage.py coverage.json
