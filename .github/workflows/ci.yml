name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Check Python repository contracts
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets
      - name: Run tests
        run: cargo test --locked --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  coverage:
    name: Production coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-08-01
          components: llvm-tools-preview
      - name: Install pinned cargo-llvm-cov
        run: cargo +1.97.1 install cargo-llvm-cov --version 0.8.6 --locked
      - name: Measure production functions, lines, regions, and branches
        run: >-
          cargo +nightly-2026-08-01 llvm-cov
          --locked
          --workspace
          --all-features
          --branch
          --json
          --summary-only
          --output-path coverage.json
      - name: Enforce exact production coverage
        run: python3 scripts/ci/verify_coverage.py coverage.json
