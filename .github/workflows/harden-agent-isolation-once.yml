name: Harden hourly agent isolation once

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - feat/agent-safety-kernel
    paths:
      - .github/workflows/harden-agent-isolation-once.yml

permissions:
  contents: write

concurrency:
  group: harden-agent-isolation-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'feat/agent-safety-kernel'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/agent-safety-kernel
          fetch-depth: 1
          persist-credentials: false

      - name: Apply isolation repair and repository contracts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/hourly-product-development.yml')
          text = path.read_text(encoding='utf-8')

          old_directories = '''          install -d -m 0750 "$baseline" "$workspace" "$agent_home" "$agent_home/tmp"
          git archive HEAD | tar -x -C "$baseline"
          git archive HEAD | tar -x -C "$workspace"
          git rev-parse HEAD >"${RUNNER_TEMP}/originweave-base-sha"
          sudo chown -R root:root "$baseline" "${RUNNER_TEMP}/originweave-base-sha"
'''
          new_directories = '''          install -d -m 0750 \\
            "$baseline" "$workspace" "$agent_home" "$agent_home/tmp" \\
            "$agent_home/target" "$agent_home/pycache" "$agent_home/cargo"
          git archive HEAD | tar -x -C "$baseline"
          git archive HEAD | tar -x -C "$workspace"
          git rev-parse HEAD >"${RUNNER_TEMP}/originweave-base-sha"
          CARGO_HOME="$agent_home/cargo" cargo +1.97.1 fetch --locked
          sudo chown -R root:root "$baseline" "${RUNNER_TEMP}/originweave-base-sha"
'''
          if old_directories not in text:
              raise SystemExit('prepare-workspace anchor not found')
          text = text.replace(old_directories, new_directories, 1)

          old_trap = '''          set -euo pipefail
          trap 'sudo pkill -KILL -u 65532 >/dev/null 2>&1 || true' EXIT
          prompt="$(cat "${RUNNER_TEMP}/originweave-agent-prompt.md")"
'''
          new_trap = '''          set -euo pipefail
          cleanup_agent() {
            sudo pkill -KILL -u 65532 >/dev/null 2>&1 || true
            sudo iptables -D OUTPUT -m owner --uid-owner 65532 ! -d 127.0.0.0/8 -j REJECT >/dev/null 2>&1 || true
            sudo ip6tables -D OUTPUT -m owner --uid-owner 65532 ! -d ::1/128 -j REJECT >/dev/null 2>&1 || true
          }
          trap cleanup_agent EXIT
          sudo iptables -I OUTPUT 1 -m owner --uid-owner 65532 ! -d 127.0.0.0/8 -j REJECT
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner 65532 ! -d ::1/128 -j REJECT
          prompt="$(cat "${RUNNER_TEMP}/originweave-agent-prompt.md")"
'''
          if old_trap not in text:
              raise SystemExit('agent cleanup anchor not found')
          text = text.replace(old_trap, new_trap, 1)

          old_environment = '''                CARGO_HOME="$AGENT_HOME/cargo" \\
                RUSTUP_HOME="/home/runner/.rustup" \\
                LANG=C.UTF-8 \\
'''
          new_environment = '''                CARGO_HOME="$AGENT_HOME/cargo" \\
                CARGO_TARGET_DIR="$AGENT_HOME/target" \\
                CARGO_NET_OFFLINE=true \\
                RUSTUP_HOME="/home/runner/.rustup" \\
                PYTHONPYCACHEPREFIX="$AGENT_HOME/pycache" \\
                PYTHONDONTWRITEBYTECODE=1 \\
                LANG=C.UTF-8 \\
'''
          if old_environment not in text:
              raise SystemExit('agent environment anchor not found')
          text = text.replace(old_environment, new_environment, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python3 -m unittest discover -s tests -p 'test_*.py'
          rm .github/workflows/harden-agent-isolation-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/hourly-product-development.yml .github/workflows/harden-agent-isolation-once.yml
          git diff --cached --check
          git commit -m 'fix(ci): isolate agent egress and build outputs'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/agent-safety-kernel
