[workspace]
members = [
    "crates/originweave-core",
    "crates/originweave-policy",
    "crates/originweave-resource",
    "crates/originweave-evidence",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Contextual Wisdom Lab"]
repository = "https://github.com/ContextualWisdomLab/OriginWeave"
homepage = "https://github.com/ContextualWisdomLab/OriginWeave"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
